<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学習記録">
<meta name="theme-color" content="#edf0f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<title>学習記録ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Chivo+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* layout: one phone-width column, summary first, fixed tab bar at the bottom */
:root{
  --bg:#edf0f6; --surface:#ffffff; --ink:#17223b; --muted:#5b667e; --line:#d7deea; --soft:#f3f5fa;
  --accent:#d9432a; --accent-ink:#ffffff; --good:#1f8a5f; --warn:#a8690a; --wood:#b5895b; --wood-hi:#d0aa7c; --wood-lo:#7c5836; --wood-back:#8e6842; --plate-ink:#2a1c0f;
  --display:"Chivo Mono","SFMono-Regular",Menlo,monospace;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420; --surface:#182031; --ink:#e8ecf5; --muted:#9aa5ba; --line:#2b3549; --soft:#1f2839;
    --accent:#ff6a4d; --accent-ink:#1a0d08; --good:#4fc493; --warn:#e3b04b; --wood:#6b4c31; --wood-hi:#86623f; --wood-lo:#34241a; --wood-back:#473221; --plate-ink:#f4e6d2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --surface:#182031; --ink:#e8ecf5; --muted:#9aa5ba; --line:#2b3549; --soft:#1f2839;
  --accent:#ff6a4d; --accent-ink:#1a0d08; --good:#4fc493; --warn:#e3b04b; --wood:#6b4c31; --wood-hi:#86623f; --wood-lo:#34241a; --wood-back:#473221; --plate-ink:#f4e6d2; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
h1{font-size:19px;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:13px;margin:0;font-weight:700;color:var(--muted);letter-spacing:.06em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top small{color:var(--muted);display:block;font-size:12px}
.pill{background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.pill b{font-family:var(--display);font-size:15px;margin:0 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.today{display:flex;gap:16px;align-items:center}
.today .big{font-size:38px;line-height:1.1}
.today .big span{font-family:var(--body);font-size:14px;font-weight:700;margin:0 4px 0 2px}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--soft)} .ring .val{stroke:var(--accent);transition:stroke-dashoffset .5s}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--muted);line-height:1.3}
.ring div b{font-size:17px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--soft);border-radius:10px;padding:8px 10px}
.stats small{display:block;color:var(--muted);font-size:11px}
.stats b{font-size:16px}
.cta{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;width:100%}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:500}
.running{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;width:100%;text-align:left}
.running .num{font-size:20px}
/* chart */
.chart{display:grid;grid-template-columns:30px 1fr;gap:4px 6px}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:140px;font-size:10px;color:var(--muted);text-align:right;font-family:var(--display)}
.yax span{transform:translateY(-50%)} .yax span:last-child{transform:translateY(50%)}
.plot{height:140px;display:flex;align-items:flex-end;gap:var(--gap,8px);position:relative;border-bottom:1px solid var(--line);
  background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.col em{font-style:normal;font-size:10px;font-family:var(--display);color:var(--muted);margin-bottom:2px}
.stack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;min-height:0}
.stack i{display:block;min-height:1px}
.xl{grid-column:2;display:flex;gap:var(--gap,8px);font-size:11px;color:var(--muted)}
.xl span{flex:1;text-align:center;min-width:0;white-space:nowrap}
.xl .hi{color:var(--accent);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* records */
ul{list-style:none;margin:0;padding:0}
.rec{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec b{font-weight:700;display:block;font-size:14px}
.rec small{color:var(--muted);font-size:12px;display:block;overflow-wrap:anywhere}
.rec .rt{font-family:var(--display);font-size:13px}
.rec .mini{border:0;background:var(--soft);border-radius:8px;padding:4px 10px;font-size:12px}
.editrow{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.editrow input{width:84px}
.day{font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;padding-top:8px}
.empty{color:var(--muted);font-size:13px;margin:0}
/* forms */
input,select{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
label{font-size:12px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;display:inline-flex;align-items:center;gap:7px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.clock{font-size:54px;text-align:center;line-height:1.2;padding:10px 0 2px}
.nav2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav2 button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:34px}
.nav2 button:disabled{opacity:.35;cursor:default}
.nav2 b{font-size:14px}
.bd{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.bd .bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bd .bar i{display:block;height:100%;border-radius:5px}
.bd .t{font-family:var(--display);font-size:12px;text-align:right}
.subj{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center}
.sw{width:36px;height:36px;border-radius:10px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.danger{color:var(--accent);border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin:0}
.sync{display:flex;gap:8px;align-items:center;font-size:13px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--accent)}
input[type=checkbox]{width:20px;height:20px;padding:0;flex:none;accent-color:var(--accent)}
.check{flex-direction:row;align-items:center;gap:10px;font-size:13px;color:var(--ink);font-weight:500}
.todo{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink);font-weight:500}
.todo:first-child{border-top:0}
.todo span{overflow-wrap:anywhere}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.addrow button{white-space:nowrap}
.prog{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal b{color:var(--muted);font-size:11px}
.cal span{aspect-ratio:1;border-radius:8px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;position:relative;overflow:hidden}
.cal span i{position:absolute;inset:0;background:var(--accent)}
.cal span u{position:relative;text-decoration:none}
.cal span u.num{font-size:9px}
.cal span.now{outline:2px solid var(--ink);outline-offset:-2px}
.mini{border:0;background:var(--soft);border-radius:8px;padding:4px 10px;font-size:12px;white-space:nowrap}
.chip.sm{padding:5px 12px;font-size:13px}
.chips.sub{padding-left:44px}
.todo{grid-template-columns:20px 1fr auto}
.todo b{display:block;font-weight:700}
.todo small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.ug{display:flex;flex-direction:column}
.ug>span{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;padding-bottom:4px}
.ur{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0 7px 16px;border-top:1px solid var(--line)}
.ur b{font-size:14px;font-weight:500;display:block}
.ur small{font-size:12px;color:var(--muted);display:block}
.ur.none b{color:var(--muted)}
.ur .rt{font-size:13px}
textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;color:inherit;width:100%;resize:vertical}
.g{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-weight:700;font-size:14px;line-height:1;background:var(--soft);color:var(--muted);flex:none}
.g.o{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.g.t{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.g.x{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.cells{display:flex;flex-wrap:wrap;gap:4px}
.rec.pr{grid-template-columns:26px 1fr auto auto}
.book{background:none;border:0;padding:0;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
.book b{display:block;font-size:15px}
.book small{color:var(--muted);font-size:12px;display:block}
.plist{gap:0}
.plist>.note{padding-bottom:8px}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;text-align:left}
.prow small{color:var(--muted);font-size:12px;font-family:var(--display)}
.pnote{margin:-4px 0 10px 52px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pbox{background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.pbox input,.pbox textarea{background:var(--surface)}
.att{display:grid;grid-template-columns:26px auto 1fr auto;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.att span{overflow-wrap:anywhere}
.att .mini{background:var(--surface)}
.res{display:flex;gap:8px}
.res button{flex:1;font-size:24px;line-height:1;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted)}
.res button.o[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.res button.t[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}
.res button.x[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.prow{grid-template-columns:1fr auto;padding:8px 0}
.pinfo{display:grid;grid-template-columns:40px 1fr;gap:6px;align-items:center;background:none;border:0;padding:4px 0;text-align:left;min-width:0}
.pinfo .cells{align-items:center}
.pinfo small{color:var(--muted);font-size:11px;font-family:var(--display)}
.qk{display:flex;gap:6px}
.qk button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;line-height:1;padding:0}
.qk .o{color:var(--good)} .qk .t{color:var(--warn)} .qk .x{color:var(--accent)}
.qnote{margin:0 0 10px}
.bdate{padding-bottom:8px}
.bdate input{width:auto;flex:1;padding:6px 10px}
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 12px}
.tome{--c:var(--muted);background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:4px 12px 12px 4px;padding:12px 12px 12px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px;box-shadow:0 7px 0 -3px var(--line)}
.tome b{font-size:15px;line-height:1.35;overflow-wrap:anywhere;flex:1}
.tome small{font-size:11px;color:var(--muted)}
.tome em{font-style:normal;color:var(--accent);font-weight:700}
.tome .prog{height:6px;display:block}
.chead{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:none;border:0;padding:0;text-align:left;width:100%}
.chead b{display:block;font-size:15px}
.chead small{display:block;font-size:12px;color:var(--muted)}
.chead .chev{font-style:normal;color:var(--muted);font-size:14px}
.chead .cells{grid-column:1/-1}
.chead[aria-expanded="true"]{padding-bottom:10px}
.cset{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;display:flex;flex-direction:column;gap:10px}
.addrow.sub{padding-left:44px;margin-bottom:8px}
.fold{background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;text-align:left;padding:0 0 4px 44px}
.tbar{display:flex;gap:8px;align-items:center;padding-bottom:10px}
.tbar .cta{flex:1;width:auto;padding:12px;font-size:15px}
.tbar .ghost{white-space:nowrap;padding:11px 12px}
.tbar .num{font-size:20px;min-width:98px}
.resume{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;background:var(--soft);border:0;border-radius:12px;padding:10px 14px;width:100%}
.resume b{display:block}
.resume small{color:var(--muted);font-size:12px}
.resume i{font-style:normal;font-weight:700;color:var(--accent);white-space:nowrap}
.tw{display:flex;flex-direction:column;gap:8px;min-width:0}
.tw .tome{flex:none}
.qs{padding:9px 10px;font-size:13px;font-weight:700;color:var(--accent);text-align:left;overflow:hidden;text-overflow:ellipsis}
.chrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.go{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:15px;line-height:1;padding:0 0 0 3px}
.case{background:var(--wood-back);border:6px solid var(--wood-lo);border-radius:8px;padding:8px 10px 2px;box-shadow:inset 0 10px 16px rgba(0,0,0,.28)}
.plate{display:inline-block;background:var(--wood-hi);color:var(--plate-ink);font-size:11px;font-weight:700;padding:2px 10px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.srow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;padding:12px 4px 0;position:relative;margin-bottom:22px;min-height:180px}
.srow::after{content:"";position:absolute;left:-10px;right:-10px;bottom:-12px;height:12px;background:linear-gradient(var(--wood-hi),var(--wood));box-shadow:0 6px 8px rgba(0,0,0,.42)}
.tw{position:relative}
.case .tome{position:relative;width:100%;height:168px;overflow:visible;border:0;border-radius:2px 6px 6px 2px;padding:10px 7px 8px 15px;gap:3px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);
  background:linear-gradient(90deg,rgba(0,0,0,.34) 0 7px,rgba(255,255,255,.22) 7px 9px,rgba(0,0,0,0) 9px),linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.16)),var(--c);
  box-shadow:3px 0 0 -1px rgba(255,255,255,.55),4px 3px 7px rgba(0,0,0,.45)}
.case .tome.hasq{padding-bottom:38px}
.case .tome b{font-size:13px;line-height:1.3;flex:1;min-height:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.case .tome small{font-size:10px;color:rgba(255,255,255,.9)}
.case .tome .prog{height:4px;background:rgba(255,255,255,.3);border-radius:2px}
.case .tome .prog i{background:#fff}
.case .tome em{position:absolute;top:-7px;right:-5px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#d9432a;color:#fff;font-size:12px;line-height:22px;text-align:center;text-shadow:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tw .qs{position:absolute;left:13px;right:5px;bottom:6px;background:rgba(255,255,255,.94);color:#1d2433;border-radius:999px;padding:5px 8px;font-size:11px;white-space:nowrap}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:560px;margin:0 auto;display:flex}
nav a{flex:1;text-align:center;padding:8px 0 9px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a[aria-current="page"]{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav aria-label="メニュー"><div>
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>ホーム</a>
  <a href="#books" data-tab="books"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h11M9 8h6"/></svg>本棚</a>
  <a href="#report" data-tab="report"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>レポート</a>
  <a href="#setup" data-tab="setup"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>設定</a>
</div></nav>
<div id="toast" role="status"></div>
<input id="bk-file" type="file" accept=".json,application/json" hidden>
<script>
(function(){
"use strict";
var PALETTE=["#3b6fd4","#e0703a","#2f9e7a","#b558c9","#d4a017","#d8517a","#3aa7c2","#7a7f8c"];

var DEFAULTS={subjects:[{id:"s1",name:"商業簿記",color:0},{id:"s2",name:"会計学",color:1},{id:"s3",name:"工業簿記",color:2},{id:"s4",name:"原価計算",color:3}],
  weeklyGoalMin:1560,examName:"日商簿記1級",examDate:"2026-11-15",totalGoalMin:0,todos:[],timer:null};
function clone(o){return JSON.parse(JSON.stringify(o));}
function normalize(s){
  var d=clone(DEFAULTS),o=s||{};
  if(Array.isArray(o.subjects)) d.subjects=o.subjects.filter(function(x){return x&&x.id;}).map(function(x){return {id:String(x.id),name:String(x.name||""),color:(+x.color||0)%PALETTE.length,units:Array.isArray(x.units)?x.units.filter(function(u){return u&&u.id;}).map(function(u){return {id:String(u.id),name:String(u.name||"")};}):[]};});
  d.subjects.forEach(function(x){if(!Array.isArray(x.units))x.units=[];});
  if(typeof o.weeklyGoalMin==="number") d.weeklyGoalMin=o.weeklyGoalMin;
  if(typeof o.examName==="string") d.examName=o.examName;
  if(typeof o.examDate==="string") d.examDate=o.examDate;
  if(typeof o.totalGoalMin==="number") d.totalGoalMin=o.totalGoalMin;
  if(Array.isArray(o.todos)) d.todos=o.todos.filter(function(x){return x&&x.id;}).map(function(x){return {id:String(x.id),text:String(x.text||""),done:!!x.done,subjectId:String(x.subjectId||""),unitId:String(x.unitId||"")};});
  d.timer=(o.timer&&o.timer.startedAt)?{subjectId:String(o.timer.subjectId||""),bookId:String(o.timer.bookId||""),chId:String(o.timer.chId||""),startedAt:+o.timer.startedAt,pausedAt:(+o.timer.pausedAt||null),pausedMs:(+o.timer.pausedMs||0)}:null;
  return d;
}

/* ---------- dates & formatting ---------- */
function pad(n){return n<10?"0"+n:""+n;}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x;}
function weekStart(d){var w=(d.getDay()+6)%7;return addDays(d,-w);}
function fmt(min){min=Math.round(min);var h=Math.floor(min/60),m=min%60;return h?(h+"時間"+(m?m+"分":"")):(m+"分");}
function hrs(min){var h=min/60;return (h>=10?Math.round(h):Math.round(h*10)/10)+"h";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function subj(id){var a=state.settings.subjects;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function sname(id){var s=subj(id);return s?s.name:"(削除した科目)";}
function scolor(id){var s=subj(id);return s?PALETTE[s.color]:PALETTE[7];}
function recList(){return Object.keys(state.records).map(function(k){return state.records[k];}).filter(function(r){return r&&r.date&&r.min>0;});}
function byDate(){var m={};recList().forEach(function(r){var d=m[r.date]||(m[r.date]={total:0,s:{}});d.total+=r.min;d.s[r.subjectId]=(d.s[r.subjectId]||0)+r.min;});return m;}
function sumRange(map,from,to){var t=0,days=0,s={};for(var d=from;d<=to;d=addDays(d,1)){var x=map[dkey(d)];if(x){t+=x.total;days++;for(var k in x.s)s[k]=(s[k]||0)+x.s[k];}}return {total:t,days:days,s:s};}
function streak(map){var d=new Date(),n=0;if(!map[dkey(d)])d=addDays(d,-1);while(map[dkey(d)]){n++;d=addDays(d,-1);}return n;}

var BK=LS+":backup-at";
function backupAt(){try{return +localStorage.getItem(BK)||0;}catch(e){return 0;}}
function backupFile(){
  var name="学習記録ノート_"+dkey(new Date())+".json";
  var text=JSON.stringify({app:"study-log",v:1,at:Date.now(),settings:state.settings,records:state.records,books:state.books});
  var done=function(){try{localStorage.setItem(BK,String(Date.now()));}catch(e){}toast("書き出しました");render();};
  var dl=function(){var a=document.createElement("a"),u=URL.createObjectURL(new Blob([text],{type:"application/json"}));
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);done();};
  try{var f=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(done,function(e){if(!e||e.name!=="AbortError")dl();});return;}
  }catch(e){}
  dl();
}
function restoreFile(file){
  if(!file)return;var rd=new FileReader();
  rd.onload=function(){var d;try{d=JSON.parse(rd.result);}catch(e){d=null;}
    if(!d||d.app!=="study-log"||!d.settings){toast("このアプリの書き出しファイルではありません");return;}
    var recs=(d.records&&typeof d.records==="object")?d.records:{},bks=(d.books&&typeof d.books==="object")?d.books:{};
    if(!confirm("いまの記録をすべて、このファイルの内容に置き換えます。\n記録 "+Object.keys(recs).length+"件 ・ 教材 "+Object.keys(bks).length+"冊"))return;
    state.settings=normalize(d.settings);state.records=recs;state.books={};
    Object.keys(bks).forEach(function(k){var f=fixBook(bks[k]);if(f)state.books[k]=f;});
    ui.bookId=null;ui.chId=null;ui.prob=null;persist();render();toast("読み込みました");};
  rd.onerror=function(){toast("ファイルを読めませんでした");};
  rd.readAsText(file);
}

/* ---------- pieces ---------- */
function niceMax(min){var h=min/60,c=[1,2,4,6,8,10,12,16,20,24,30,40,60,80,100,150,200,300,500,1000];for(var i=0;i<c.length;i++)if(c[i]>=h)return c[i]*60;return Math.ceil(h/500)*500*60;}
function chart(items){
  var max=niceMax(Math.max.apply(null,items.map(function(i){return i.total;}).concat([60])));
  var gap=items.length>12?2:8,showVal=items.length<=7;
  var cols=items.map(function(it){
    var segs=Object.keys(it.s).map(function(id){return '<i style="flex:'+it.s[id]+';background:'+scolor(id)+'"></i>';}).join("");
    return '<div class="col">'+(showVal&&it.total?'<em>'+hrs(it.total).replace("h","")+'</em>':'')+'<div class="stack" style="height:'+(it.total/max*100).toFixed(2)+'%" title="'+esc(it.title+" "+fmt(it.total))+'">'+segs+'</div></div>';
  }).join("");
  var xl=items.map(function(it){return '<span'+(it.hi?' class="hi"':'')+'>'+esc(it.label)+'</span>';}).join("");
  return '<div class="chart" style="--gap:'+gap+'px" role="img" aria-label="学習時間の棒グラフ"><div class="yax"><span>'+hrs(max)+'</span><span>'+hrs(max/2)+'</span><span>0</span></div><div class="plot">'+cols+'</div><div class="xl">'+xl+'</div></div>';
}

  return ids.length?'<div class="legend">'+ids.map(function(id){return '<span><i class="dot" style="background:'+scolor(id)+'"></i>'+esc(sname(id))+'</span>';}).join("")+'</div>':'';}

function recGroups(list){
  if(!list.length)return '<p class="empty">この期間の記録はまだありません。</p>';
  list.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.at||0)-(a.at||0);});
  var out="",cur=null,tot={};list.forEach(function(r){tot[r.date]=(tot[r.date]||0)+r.min;});
  list.forEach(function(r){
    if(r.date!==cur){if(cur)out+='</ul>';cur=r.date;var d=parse(r.date);out+='<div class="day"><span>'+(d.getMonth()+1)+'月'+d.getDate()+'日('+WD[d.getDay()]+')</span><span>'+fmt(tot[r.date])+'</span></div><ul>';}
    out+=recRow(r);
  });
  return out+'</ul>';
}

  if(due.length)h+='<section class="card"><h2>今日の復習</h2><ul>'+due.map(function(r){
    return '<li class="rec"><i class="dot" style="background:'+scolor(r.subjectId)+'"></i><div><b>'+esc(label(r.subjectId,r.unitId))+'</b><small>'+esc(md(r.date)+" 学習分 ・ "+((r.rd||0)+1)+"回目の復習"+(r.memo?" ・ "+r.memo:""))+'</small></div><button class="mini" data-act="review-rec" data-id="'+esc(r.id)+'">記録する</button><button class="mini" data-act="review" data-id="'+esc(r.id)+'">済み</button></li>';}).join("")+'</ul></section>';
  var nr=needReview();if(nr.length)h+=probCard(nr,3,true);
  if(!subj(ui.todoSub))ui.todoSub=(s.subjects[0]||{}).id||"";
  var ts=subj(ui.todoSub);
  h+='<section class="card"><h2>やることリスト</h2>'+(s.todos.length?'<div>'+s.todos.map(function(x){var has=subj(x.subjectId);
      return '<div class="todo'+(x.done?' done':'')+'"><input id="td-'+esc(x.id)+'" type="checkbox" data-todo="'+esc(x.id)+'"'+(x.done?' checked':'')+' aria-label="完了にする"><span>'+
        (has?'<b><i class="dot" style="background:'+scolor(x.subjectId)+'"></i> '+esc(label(x.subjectId,x.unitId))+'</b>'+(x.text?'<small>'+esc(x.text)+'</small>':''):'<b>'+esc(x.text)+'</b>')+'</span>'+
        (has&&!x.done?'<button class="mini" data-act="todo-rec" data-id="'+esc(x.id)+'">記録する</button>':'<span></span>')+'</div>';}).join("")+'</div>'
      :'<p class="empty">やることはまだありません。</p>')+
    (ts?'<div class="row"><label for="todo-sub">科目<select id="todo-sub" data-t="sub">'+s.subjects.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===ts.id?' selected':'')+'>'+esc(x.name)+'</option>';}).join("")+'</select></label>'+
      '<label for="todo-unit">範囲<select id="todo-unit" data-t="unit"><option value="">指定なし</option>'+ts.units.map(function(u){return '<option value="'+esc(u.id)+'"'+(u.id===ui.todoUnit?' selected':'')+'>'+esc(u.name)+'</option>';}).join("")+'</select></label></div>'+
      '<div class="addrow"><input id="todo-new" data-f="todo" value="'+esc(ui.todo)+'" placeholder="内容(任意) 例: 答練 第3回の解き直し" maxlength="60" aria-label="やることの内容"><button class="ghost" data-act="todo-add">追加</button></div>'
      :'<p class="empty">科目がありません。</p>')+
    (s.todos.some(function(x){return x.done;})?'<button class="ghost" data-act="todo-clear">完了したものを消す</button>':'')+'</section>';
  if(s.totalGoalMin>0){
    var pct=Math.min(1,all/s.totalGoalMin),rest=Math.max(0,s.totalGoalMin-all),line;
    if(rest===0)line="目標時間を達成しました";
    else{line="残り "+fmt(rest);if(s.examDate){var dd=Math.round((parse(s.examDate)-parse(tk))/864e5);if(dd>0)line+=" ・ 試験日まで1日あたり "+fmt(Math.ceil(rest/dd));}}
    h+='<section class="card"><h2>合計目標</h2><div class="prog"><i style="width:'+(pct*100).toFixed(1)+'%"></i></div><p class="note">'+fmt(all)+' / '+fmt(s.totalGoalMin)+' ('+Math.round(pct*100)+'%) ・ '+line+'</p></section>';
  }
  return h;
}
function accCard(list){var a={},any=false;
  list.forEach(function(r){if(r.q>0){any=true;var x=a[r.subjectId]||(a[r.subjectId]={q:0,c:0});x.q+=r.q;x.c+=r.c||0;}});
  if(!any)return "";
  return '<section class="card"><h2>演習の正答率</h2><div class="bd">'+Object.keys(a).map(function(id){var x=a[id],p=Math.round(x.c/x.q*100);
    return '<span><i class="dot" style="background:'+scolor(id)+'"></i> '+esc(sname(id))+'</span><div class="bar"><i style="width:'+p+'%;background:'+scolor(id)+'"></i></div><span class="t">'+p+'% ・ '+x.c+'/'+x.q+'問</span>';}).join("")+'</div></section>';}
function calCard(map,from,to){var max=60,d,x;
  for(d=from;d<=to;d=addDays(d,1)){x=map[dkey(d)];if(x&&x.total>max)max=x.total;}
  var h='<section class="card"><h2>学習カレンダー</h2><div class="cal">'+["月","火","水","木","金","土","日"].map(function(w){return '<b>'+w+'</b>';}).join(""),tk=dkey(new Date());
  for(var i=(from.getDay()+6)%7;i>0;i--)h+='<div></div>';
  for(d=from;d<=to;d=addDays(d,1)){var k=dkey(d),t=map[k]?map[k].total:0;
    h+='<span'+(k===tk?' class="now"':'')+' title="'+(d.getMonth()+1)+'/'+d.getDate()+' '+fmt(t)+'">'+(t?'<i style="opacity:'+(0.14+t/max*0.46).toFixed(2)+'"></i>':'')+'<u>'+d.getDate()+'</u>'+(t?'<u class="num">'+hrs(t)+'</u>':'')+'</span>';}
  return h+'</div></section>';}

/* ---------- bookshelf: book > topic (論点) > problem ---------- */
var RES={o:"○",t:"△",x:"×"},KIND={out:"アウトプット","in":"インプット"};
function kindOf(b){return b&&b.kind==="in"?"in":"out";}
function kindSeg(act,cur){return '<div class="seg" role="group" aria-label="種類">'+["out","in"].map(function(x){return '<button data-act="'+act+'" data-id="'+x+'" aria-pressed="'+(cur===x)+'">'+KIND[x]+'</button>';}).join("")+'</div>';}
function fixBook(b){
  if(!b||!b.id)return null;
  if(Array.isArray(b.ch))return b;
  var nb=clone(b),u=unit(b.subjectId,b.unitId),p={},k;
  nb.ch=[{id:"c0",name:u?u.name:"全範囲",unitId:b.unitId||"",count:b.count||10}];
  for(k in (b.p||{}))p["c0:"+k]=b.p[k];
  nb.p=p;delete nb.count;delete nb.unitId;return nb;
}
function bookList(){return Object.keys(state.books).map(function(k){return state.books[k];}).filter(function(b){return b&&b.id&&Array.isArray(b.ch);}).sort(function(a,b){return (a.at||0)-(b.at||0);});}
function chOf(b,id){for(var i=0;i<b.ch.length;i++)if(b.ch[i].id===id)return b.ch[i];return null;}
function attempts(b,c,n){return ((b.p||{})[c.id+":"+n]||[]).map(function(x,i){return {d:x.d,r:x.r,n:x.n||"",i:i};}).sort(function(a,e){return a.d<e.d?-1:a.d>e.d?1:a.i-e.i;});}
function latest(b,c,n){var a=attempts(b,c,n);return a.length?a[a.length-1]:null;}
function chStats(b,c){var s={o:0,t:0,x:0,none:0};for(var i=1;i<=c.count;i++){var l=latest(b,c,i);if(l&&s[l.r]!=null)s[l.r]++;else s.none++;}return s;}
function bookStats(b){var s={o:0,t:0,x:0,none:0,total:0};b.ch.forEach(function(c){var x=chStats(b,c);s.o+=x.o;s.t+=x.t;s.x+=x.x;s.none+=x.none;s.total+=c.count;});return s;}
function needReview(){var out=[];bookList().forEach(function(b){b.ch.forEach(function(c){for(var i=1;i<=c.count;i++){var l=latest(b,c,i);if(l&&l.r!=="o")out.push({b:b,c:c,n:i,l:l});}});});
  return out.sort(function(a,e){return a.l.d<e.l.d?-1:a.l.d>e.l.d?1:0;});}
function gl(r){return '<span class="g '+(RES[r]?r:"")+'">'+(RES[r]||"・")+'</span>';}
function probCard(nr,limit,more){
  return '<section class="card"><h2>解き直す問題 '+nr.length+'問</h2><ul>'+nr.slice(0,limit).map(function(x){
    return '<li class="rec pr">'+gl(x.l.r)+'<div><b>'+esc(x.c.name+" 問"+x.n)+'</b><small>'+esc(x.b.name+" ・ "+md(x.l.d)+(x.l.n?" ・ "+x.l.n:""))+'</small></div><span></span><button class="mini" data-act="book-open" data-id="'+esc(x.b.id+":"+x.c.id+":"+x.n)+'">開く</button></li>';}).join("")+'</ul>'+
    (nr.length>limit?'<p class="note">ほか '+(nr.length-limit)+'問(解いた日が古い順)</p>':'')+(more?'<button class="ghost" data-act="go-books">本棚を開く</button>':'')+'</section>';}
function viewBooks(){
  var cur=ui.bookId&&state.books[ui.bookId];if(cur&&Array.isArray(cur.ch))return viewBook(cur);
  ui.bookId=null;
  var s=state.settings,list=bookList(),nr=needReview(),k=ui.bk,h='<div class="top"><h1>本棚</h1></div>';
  if(nr.length)h+=probCard(nr,20,false);
  var tile=function(b,i){var st=bookStats(b),rev=st.t+st.x,q=quickStart(b);
    return '<div class="tw h'+(i%3)+'"><button class="tome'+(q?' hasq':'')+'" data-act="book-open" data-id="'+esc(b.id)+'" style="--c:'+scolor(b.subjectId)+'"><b>'+esc(b.name)+'</b><small>'+esc(sname(b.subjectId))+'</small><small>論点 '+b.ch.length+' ・ '+st.total+'問</small>'+
      '<span class="prog"><i style="width:'+(st.total?(st.o/st.total*100).toFixed(1):0)+'%"></i></span><small>○ '+st.o+'/'+st.total+'</small>'+(rev?'<em title="解き直し '+rev+'問" aria-label="解き直し '+rev+'問">'+rev+'</em>':'')+'</button>'+q+'</div>';};
  var shelfOf=function(title,bl){var rows="",i;
    for(i=0;i<Math.max(bl.length,1);i+=3)rows+='<div class="srow">'+bl.slice(i,i+3).map(function(b,j){return tile(b,i+j);}).join("")+'</div>';
    return '<div class="case"><span class="plate">'+title+(bl.length?' '+bl.length+'冊':'')+'</span>'+rows+'</div>';};
  if(!list.length)h+=shelfOf("本棚",[])+'<p class="note">まだ本がありません。</p>';
  [["out","アウトプット(問題集・答練)"],["in","インプット(テキスト・講義)"]].forEach(function(g){var bl=list.filter(function(b){return kindOf(b)===g[0];});
    if(bl.length)h+=shelfOf(g[1],bl);});
  if(list.some(function(b){var st=bookStats(b);return st.t+st.x;}))h+='';
  if(!subj(k.sub))k.sub=(s.subjects[0]||{}).id||"";
  var bs=subj(k.sub);
  h+='<section class="card"><h2>本棚に問題集を追加</h2>'+(bs?
    '<div class="row"><label for="b-sub" style="flex:0 0 40%">科目<select id="b-sub" data-b="sub">'+s.subjects.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===bs.id?' selected':'')+'>'+esc(x.name)+'</option>';}).join("")+'</select></label>'+
    '<label for="b-name">問題集の名前<input id="b-name" data-b="name" value="'+esc(k.name)+'" placeholder="例: 問題集1" maxlength="40"></label></div>'+
    kindSeg("bk-kind",k.kind==="in"?"in":"out")+
    '<button class="cta" data-act="book-add">追加して論点を登録する</button>'
    :'<p class="empty">科目がありません。</p>')+'</section>';
  return h;
}
function viewBook(b){
  var today=dkey(new Date()),body="",nrev=0,total=0,s=subj(b.subjectId),k=ui.bk;
  if(!/^\d{4}-\d\d-\d\d$/.test(ui.bookDate))ui.bookDate=today;
  if(ui.chId==null&&b.ch.length===1)ui.chId=b.ch[0].id;
  b.ch.forEach(function(c){
    var st=chStats(b,c),rev=st.t+st.x,open=ui.chId===c.id,cells="",rows="",i;nrev+=rev;total+=c.count;
    if(ui.bookFilter==="rev"&&!rev&&!open)return;
    if(!open){for(i=1;i<=c.count;i++){var l1=latest(b,c,i);cells+=gl(l1&&l1.r);}}
    else{
      for(i=1;i<=c.count;i++){
        var a=attempts(b,c,i),l=a.length?a[a.length-1]:null,po=ui.prob===i,noting=ui.noteFor===i&&l;
        if(ui.bookFilter==="rev"&&!po&&!noting&&!(l&&l.r!=="o"))continue;
        rows+='<div class="prow"><button class="pinfo" data-act="prob" data-id="'+i+'" aria-expanded="'+po+'"><b>問'+i+'</b><span class="cells">'+(a.length?a.map(function(x){return gl(x.r);}).join(""):"")+'<small>'+(l?md(l.d):"未着手")+'</small></span></button>'+
          '<span class="qk" role="group" aria-label="問'+i+'の結果">'+["o","t","x"].map(function(r){return '<button class="'+r+'" data-act="quick" data-id="'+i+':'+r+'" aria-label="問'+i+' '+RES[r]+'">'+RES[r]+'</button>';}).join("")+'</span></div>';
        if(noting)rows+='<label class="qnote" for="q-note">問'+i+' '+RES[l.r]+' の間違えた内容<textarea id="q-note" data-qn="'+i+'" rows="2" maxlength="300" placeholder="例: のれんの償却を忘れた">'+esc(l.n)+'</textarea></label>';
        else if(!po&&l&&l.n)rows+='<p class="pnote">'+esc(l.n)+'</p>';
        if(po){
          rows+='<div class="pbox">'+(a.length?'<div>'+a.map(function(x){var ck="a"+x.i;
              return '<div class="att">'+gl(x.r)+'<span class="num">'+md(x.d)+'</span><span>'+esc(x.n)+'</span><button class="mini" data-act="att-del" data-id="'+x.i+'">'+(ui.confirmDel===ck?"本当に削除":"削除")+'</button></div>';}).join("")+'</div>'+
              '<label for="q-note">最新の記録のメモ<textarea id="q-note" data-qn="'+i+'" rows="2" maxlength="300" placeholder="例: のれんの償却を忘れた">'+esc(l.n)+'</textarea></label>'
              :'<p class="empty">まだ記録がありません。</p>')+'</div>';
        }
      }
      if(!rows)rows='<p class="empty">この論点に解き直す問題はありません。</p>';
      rows=tbar(b,c)+rows+'<div class="cset"><div class="row"><label for="cm-name">論点名<input id="cm-name" data-cm="name" value="'+esc(c.name)+'" maxlength="30"></label><label for="cm-count" style="flex:0 0 96px">問題数<input id="cm-count" type="number" inputmode="numeric" min="1" max="200" data-cm="count" value="'+c.count+'"></label></div>'+
        '<button class="ghost danger" data-act="ch-del">'+(ui.confirmDel==="ch"?"本当に削除する(記録も消えます)":"この論点を削除")+'</button></div>';
    }
    body+='<section class="card plist"><div class="chrow"><button class="chead" data-act="ch" data-id="'+esc(c.id)+'" aria-expanded="'+open+'"><span><b>'+esc(c.name)+'</b><small>'+c.count+'問 ・ ○ '+st.o+' ・ △ '+st.t+' ・ × '+st.x+' ・ 未着手 '+st.none+'</small></span><i class="chev">'+(open?"▾":"▸")+'</i>'+(open?'':'<span class="cells">'+cells+'</span>')+'</button>'+(!open&&!state.settings.timer?'<button class="go" data-act="ch-go" data-id="'+esc(c.id)+'" aria-label="'+esc(c.name)+'のタイマーを開始">▶</button>':'')+'</div>'+rows+'</section>';
  });
  if(!b.ch.length)body='<section class="card"><p class="empty">まだ論点がありません。</p></section>';
  else if(!body)body='<section class="card"><p class="empty">解き直しが必要な問題はありません。</p></section>';
  var used={};b.ch.forEach(function(c){used[c.name]=1;});
  var sug=s?s.units.filter(function(u){return !used[u.name];}):[];
  return '<div class="top"><div><button class="mini" data-act="book-back">‹ 本棚</button><h1>'+esc(b.name)+'</h1><small>'+esc(KIND[kindOf(b)]+" ・ "+sname(b.subjectId)+" ・ 論点 "+b.ch.length+" ・ "+total+"問")+'</small></div></div>'+
    ((state.settings.timer&&!(state.settings.timer.bookId===b.id&&state.settings.timer.chId===ui.chId))?runBanner():'')+(b.ch.length?'<div class="seg" role="group" aria-label="表示する問題"><button data-act="book-filter" data-id="all" aria-pressed="'+(ui.bookFilter!=="rev")+'">すべて('+total+')</button><button data-act="book-filter" data-id="rev" aria-pressed="'+(ui.bookFilter==="rev")+'">△×のみ('+nrev+')</button></div>'+
      '<section class="card"><label class="check bdate" for="bk-date">解いた日<input id="bk-date" type="date" data-bd="1" value="'+esc(ui.bookDate)+'" max="'+today+'"></label>'+
      '</section>':'')+
    body+
    '<section class="card"><h2>論点を追加</h2>'+(sug.length?
      '<div class="row"><label for="c-unit">範囲<select id="c-unit" data-b="chUnit"><option value="">範囲を選ぶ</option>'+sug.map(function(u){return '<option value="'+esc(u.name)+'"'+(u.name===k.chUnit?' selected':'')+'>'+esc(u.name)+'</option>';}).join("")+'</select></label>'+
      '<label for="c-count" style="flex:0 0 96px">問題数<input id="c-count" type="number" inputmode="numeric" min="1" max="200" data-b="chCount" value="'+esc(k.chCount)+'"></label></div>'+
      '<button class="cta" data-act="ch-add">論点を追加</button>'
      :'<p class="empty">'+(s&&s.units.length?'登録済みの範囲はすべて追加済みです。':'この科目の範囲がまだありません。')+'</p>')+
      '<button class="ghost" data-act="go-setup">設定で範囲を追加</button></section>'+
    '<section class="card"><h2>この問題集の設定</h2><label for="bm-name">名前<input id="bm-name" data-bm="name" value="'+esc(b.name)+'" maxlength="40"></label>'+
    kindSeg("book-kind",kindOf(b))+
    '<button class="ghost danger" data-act="book-del">'+(ui.confirmDel==="book"?"本当に削除する(記録も消えます)":"この問題集を本棚から削除")+'</button></section>';
}

/* ---------- views ---------- */

  var map=byDate(),now=new Date(),tk=dkey(now),today=map[tk]?map[tk].total:0;
  var ws=weekStart(now),wk=sumRange(map,ws,addDays(ws,6)),goal=state.settings.weeklyGoalMin||0;
  var pct=goal?Math.min(1,wk.total/goal):0,C=2*Math.PI*40;
  var all=recList().reduce(function(a,r){return a+r.min;},0);
  var ex="";if(state.settings.examDate){var dd=Math.round((parse(state.settings.examDate)-parse(tk))/864e5);
    if(dd>=0)ex='<span class="pill">'+esc(state.settings.examName||"試験")+(dd===0?' 本日':' まで あと<b>'+dd+'</b>日')+'</span>';}
  var items=[],agg={};for(var i=6;i>=0;i--){var d=addDays(now,-i),x=map[dkey(d)]||{total:0,s:{}};for(var k in x.s)agg[k]=1;items.push({label:WD[d.getDay()],title:(d.getMonth()+1)+"/"+d.getDate(),total:x.total,s:x.s,hi:i===0});}

  (t?'<button class="running" data-act="go-timer"><span>'+(t.pausedAt?"一時停止中":"計測中")+' ・ '+esc(sname(t.subjectId))+'</span><span class="num" data-clock>'+clock(elapsed(t))+'</span></button>':'')+
  resumeCard()+
  '<section class="card"><h2>今日の学習時間</h2><div class="today"><div style="flex:1"><div class="num big">'+Math.floor(today/60)+'<span>時間</span>'+(today%60)+'<span>分</span></div>'+
    '<p class="note">今週 '+fmt(wk.total)+(goal?' / 目標 '+fmt(goal):'')+'</p></div>'+
    (goal?'<div class="ring"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="40" fill="none" stroke-width="10"/><circle class="val" cx="50" cy="50" r="40" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct)).toFixed(1)+'"/></svg><div><b class="num">'+Math.round(pct*100)+'%</b>週目標</div></div>':'')+
  '</div><div class="stats"><div><small>連続学習</small><b class="num">'+streak(map)+'</b> 日</div><div><small>今週の学習日</small><b class="num">'+wk.days+'</b> 日</div><div><small>累計</small><b class="num">'+hrs(all).replace("h","")+'</b> 時間</div></div>'+
  (t?'<button class="cta" data-act="go-timer">計測中の画面へ</button>':'')+'</section>'+
  homeExtras(tk,all)+
  '<section class="card"><h2>直近7日間</h2>'+chart(items)+legend(agg)+'</section>'+
  '<section class="card"><h2>今日の記録</h2>'+(todays.length?'<ul>'+todays.sort(function(a,b){return (b.at||0)-(a.at||0);}).map(recRow).join("")+'</ul>':'<p class="empty">まだ記録がありません。</p>')+'</section>';
}
function viewRecord(){
  var t=state.settings.timer,f=ui.form,body,ro=ui.reviewOf&&state.records[ui.reviewOf];
  if(t&&ui.mode==="timer"){if(subj(t.subjectId))ui.subjectId=t.subjectId;ui.matBook=t.bookId||"";ui.matCh=t.chId||"";}
  if(ui.mode==="timer"){

  "unit-add-s":function(sid){var s=subj(sid),nm=(ui.unitNewBy[sid]||"").trim();if(!s||!nm)return;
    if(s.units.some(function(u){return u.name===nm;})){toast("同じ名前の範囲がすでにあります");return;}
    if(s.units.length>=60){toast("範囲は1科目60個までです");return;}
    s.units.push({id:"u"+newId(),name:nm});ui.unitNewBy[sid]="";commitSettings();},
  fold:function(id){ui.setupOpen=(ui.setupOpen===id)?null:id;ui.confirmSub=null;render();},
  "bk-kind":function(id){ui.bk.kind=(id==="in")?"in":"out";render();},
  "book-kind":function(id){var b=state.books[ui.bookId];if(!b||kindOf(b)===id)return;var nb=clone(b);nb.kind=(id==="in")?"in":"out";state.books[b.id]=nb;commitBook(b.id);},
  "ch-rec":function(){var b=state.books[ui.bookId],c=b&&chOf(b,ui.chId);if(!c)return;
    if(!subj(b.subjectId)){toast("この教材の科目が見つかりません");return;}
    ui.mode="manual";ui.matBook=b.id;ui.matCh=c.id;goRecord();},
  "ch-go":function(id){ui.chId=id;ui.prob=null;ui.noteFor=null;ui.confirmDel=null;acts["ch-start"]();},
  "back-books":function(){location.hash="books";},
  "ch-start":function(){var b=state.books[ui.bookId],c=b&&chOf(b,ui.chId);if(!c)return;
    if(state.settings.timer){toast("計測中のタイマーがあります。先に終了してください");return;}
    if(!subj(b.subjectId)){toast("この教材の科目が見つかりません");return;}
    ui.mode="timer";state.settings.timer={subjectId:b.subjectId,bookId:b.id,chId:c.id,startedAt:Date.now(),pausedAt:null,pausedMs:0};commitSettings();},
  "ch-stop":function(){var t=state.settings.timer;if(!t)return;var min=Math.min(1440,Math.max(1,Math.round(elapsed(t)/60000)));
    var b=state.books[t.bookId],c=b&&Array.isArray(b.ch)?chOf(b,t.chId):null,sid=(b&&subj(b.subjectId))?b.subjectId:t.subjectId;
    if(!subj(sid)){toast("科目が見つかりません。「記録する」画面から終了してください");return;}
    state.settings.timer=null;commitSettings();
    addRecord(dkey(new Date(t.startedAt)),sid,min,"",{q:0,c:0,rv:false,subjectId:sid,unitId:(c&&unit(sid,c.unitId))?c.unitId:"",bookId:b?b.id:"",chId:c?c.id:""});
    toast(fmt(min)+" を記録しました");},
  resume:function(key){var p=String(key).split(":"),b=state.books[p[0]],c=b&&Array.isArray(b.ch)&&chOf(b,p[1]);if(!c||!subj(b.subjectId))return;
    if(!state.settings.timer){ui.mode="timer";state.settings.timer={subjectId:b.subjectId,bookId:b.id,chId:c.id,startedAt:Date.now(),pausedAt:null,pausedMs:0};commitSettings();}
    acts["book-open"](b.id+":"+c.id);},
  "go-timer":function(){var t=state.settings.timer,b=t&&t.bookId&&state.books[t.bookId];
    if(b&&Array.isArray(b.ch)&&chOf(b,t.chId))acts["book-open"](b.id+":"+t.chId);else if(t)goRecord();else acts["go-books"]();},
  period:function(id){ui.period=id;ui.offset=0;ui.editId=null;render();},
  prev:function(){ui.offset--;ui.editId=null;render();},
  next:function(){if(ui.offset<0){ui.offset++;ui.editId=null;render();}},
  color:function(id){var s=subj(id);if(s){s.color=(s.color+1)%PALETTE.length;commitSettings();}},
  "add-sub":function(){var a=state.settings.subjects;if(a.length>=20){toast("科目は20個までです");return;}a.push({id:"s"+newId(),name:"新しい科目",color:a.length%PALETTE.length,units:[]});commitSettings();},
  "del-sub":function(id){if(ui.confirmSub!==id){ui.confirmSub=id;render();return;}ui.confirmSub=null;state.settings.subjects=state.settings.subjects.filter(function(x){return x.id!==id;});commitSettings();}
};
document.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(!b)return;e.preventDefault();var f=acts[b.dataset.act];if(f)f(b.dataset.id);});
document.addEventListener("input",function(e){var t=e.target,f=t.dataset.f;
  if(t.dataset.x){if(t.dataset.x==="rv")ui.extra.rv=t.checked;else ui.extra[t.dataset.x]=t.value;}
  if(f==="todo")ui.todo=t.value;else if(f==="unit")ui.unitNew=t.value;else if(f==="memo")ui.memo=t.value;else if(f==="fmemo")ui.form.memo=t.value;else if(f)ui.form[f]=t.value;
  if(t.id==="edit-min")ui.editMin=t.value;
  if(t.dataset.b)ui.bk[t.dataset.b]=t.value;
  if(t.dataset.a)ui.att[t.dataset.a]=t.value;
  if(t.dataset.bd)ui.bookDate=t.value;
  if(t.dataset.un)ui.unitNewBy[t.dataset.un]=t.value;});
document.addEventListener("change",function(e){var t=e.target,s=state.settings;
  if(t.id==="bk-file"){restoreFile(t.files&&t.files[0]);return;}
  if(t.dataset.msel){if(t.dataset.msel==="book"){ui.matBook=t.value;ui.matCh="";}else ui.matCh=t.value;
    var mt=state.settings.timer;
    if(mt&&ui.mode==="timer"){var mx=recCtx(),mn=clone(mt);mn.bookId=mx.bookId;mn.chId=mx.chId;if(mx.subjectId)mn.subjectId=mx.subjectId;state.settings.timer=mn;commitSettings();}
    else render();return;}
  if(t.dataset.usel){var us=curSubject();if(us){ui.units[us]=t.value;render();}return;}
  if(t.dataset.qn){var qb=state.books[ui.bookId],qh=qb&&chOf(qb,ui.chId),qn=parseInt(t.dataset.qn,10),ql=qh&&latest(qb,qh,qn),qv=t.value.trim();
    if(ql&&ql.n!==qv){var qc=clone(qb);qc.p[qh.id+":"+qn][ql.i].n=qv;state.books[qb.id]=qc;commitBook(qb.id,true);toast("メモを保存しました");}return;}
  if(t.dataset.bm){var bk=state.books[ui.bookId];if(!bk)return;var nb=clone(bk);nb.name=t.value.trim()||bk.name;state.books[bk.id]=nb;commitBook(bk.id);return;}
  if(t.dataset.cm){var cb=state.books[ui.bookId];if(!cb||!chOf(cb,ui.chId))return;var cn=clone(cb),cc=chOf(cn,ui.chId);
    if(t.dataset.cm==="name")cc.name=t.value.trim()||cc.name;
    else{var cv=parseInt(t.value,10);if(cv>=1&&cv<=200)cc.count=cv;else toast("問題数は1〜200で入力してください");}
    state.books[cb.id]=cn;commitBook(cb.id);return;}
  if(t.dataset.t==="sub"){ui.todoSub=t.value;ui.todoUnit="";render();}
  else if(t.dataset.t==="unit"){ui.todoUnit=t.value;}
  else if(t.dataset.todo){var td=s.todos.filter(function(x){return x.id===t.dataset.todo;})[0];if(td){td.done=t.checked;commitSettings();}}
  else if(t.dataset.s==="total"){var tg=parseFloat(t.value);s.totalGoalMin=(tg>0&&tg<=9999)?Math.round(tg*60):0;commitSettings();}
  else if(t.dataset.s==="examName"){s.examName=t.value.trim();commitSettings();}
  else if(t.dataset.s==="examDate"){s.examDate=t.value;commitSettings();}
  else if(t.dataset.s==="goal"){var g=parseFloat(t.value);s.weeklyGoalMin=(g>0&&g<=168)?Math.round(g*60):0;commitSettings();}
  else if(t.dataset.sub){var x=subj(t.dataset.sub);if(x){x.name=t.value.trim()||"名称未設定";commitSettings();}}});
setInterval(function(){var t=state.settings.timer;if(!t)return;if(t.pausedAt)return;var s=clock(elapsed(t));document.querySelectorAll("[data-clock]").forEach(function(n){n.textContent=s;});},1000);
document.addEventListener("keydown",function(e){if(e.key!=="Enter"||e.isComposing)return;if(e.target.id==="todo-new"){e.preventDefault();acts["todo-add"]();}else if(e.target.dataset.un){e.preventDefault();acts["unit-add-s"](e.target.dataset.un);}});
window.addEventListener("hashchange",route);
route();
document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});
window.addEventListener("pageshow",function(e){if(e.persisted)render();});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
</script>
